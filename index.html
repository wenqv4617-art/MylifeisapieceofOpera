<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>叙事诗小手机</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
  <!-- 引入 Dexie.js 存储库 -->
  <script src="https://unpkg.com/dexie@4.0.1/dist/dexie.js"></script>
</head>
<body>
  <div id="phone-container">
    <!-- 模拟状态栏 -->
    <header id="status-bar">
      <span id="status-time">00:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.13 19.53 10.53 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
    </header>

    <!-- 桌面网格 -->
    <main id="desktop">
      <div class="app-grid" id="desktop-grid">
        <!-- 应用 1：设置 -->
        <div class="app-icon" data-app="settings" draggable="true">
          <div class="icon-wrapper">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </div>
          <span>设置</span>
        </div>

        <!-- 应用 2：档案库 -->
        <div class="app-icon" data-app="archive" draggable="true">
          <div class="icon-wrapper">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
          </div>
          <span>档案库</span>
        </div>
      </div>
    </main>

    <!-- 应用层容器（以弹出窗口形式呈现） -->
    <div id="app-window-container">
      <!-- 设置应用 -->
      <div id="win-settings" class="app-window">
        <header class="win-header">
          <button class="btn-icon back-btn" onclick="closeApp('settings')">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <h3>系统设置</h3>
        </header>
        <div class="win-body">
          <div class="settings-nav">
            <button class="nav-tab active" data-tab="api">API 设置</button>
            <button class="nav-tab" data-tab="data">数据管理</button>
          </div>
          <div class="settings-content">
            <!-- API 设置面板 -->
            <section id="panel-api" class="settings-panel active">
              <div class="form-group">
                <label>配置预设</label>
                <div class="preset-row">
                  <select id="api-presets-select">
                    <option value="">-- 选择已有预设 --</option>
                  </select>
                  <button id="btn-delete-preset" class="btn btn-danger-outline">删除</button>
                </div>
              </div>
              <div class="form-group">
                <label>预设名称</label>
                <input type="text" id="api-preset-name" placeholder="例如: 常用测试配置">
              </div>
              <div class="form-group">
                <label>选择协议</label>
                <select id="api-protocol">
                  <option value="openai">OpenAI 官方</option>
                  <option value="openai-compatible">兼容 OpenAI (如 1api 等)</option>
                  <option value="gemini">Gemini 官方</option>
                  <option value="deepseek">DeepSeek 官方</option>
                </select>
              </div>
              <div class="form-group">
                <label>API 终结点 (URL)</label>
                <input type="text" id="api-url" placeholder="https://api.openai.com/v1">
              </div>
              <div class="form-group">
                <label>API Key</label>
                <input type="password" id="api-key" placeholder="请输入您的 API 密钥">
              </div>
              <div class="form-group">
                <label>模型选择</label>
                <div class="model-row">
                  <select id="api-model-select">
                    <option value="">请先拉取模型</option>
                  </select>
                  <button id="btn-fetch-models" class="btn">拉取</button>
                </div>
              </div>
              <div class="form-group">
                <label>模型温度 (Temperature: <span id="temp-val">0.7</span>)</label>
                <input type="range" id="api-temp" min="0" max="2" step="0.1" value="0.7">
              </div>
              <div class="form-actions">
                <button id="btn-test-api" class="btn btn-outline">测试连接</button>
                <button id="btn-save-preset" class="btn btn-primary">保存预设</button>
              </div>
            </section>
            <!-- 数据管理面板 -->
            <section id="panel-data" class="settings-panel">
              <div class="data-status-card">
                <h4>本地存储状态</h4>
                <p>当前数据库总记录数: <span id="db-total-records">0</span></p>
              </div>
              <div class="data-actions">
                <button id="btn-export-data" class="btn">导出备份 (JSON)</button>
                <button id="btn-import-trigger" class="btn btn-outline">导入备份 (JSON)</button>
                <input type="file" id="file-import" accept=".json" style="display: none;">
              </div>
            </section>
          </div>
        </div>
      </div>

      <!-- 档案库应用 -->
      <div id="win-archive" class="app-window">
        <header class="win-header">
          <button class="btn-icon back-btn" onclick="closeApp('archive')">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <h3 id="archive-title">档案库 - 角色</h3>
          <button class="btn-icon" id="btn-add-archive">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
        </header>
        <div class="win-body">
          <!-- 档案主显示区 -->
          <div id="archive-list-container" class="archive-main">
            <!-- 动态渲染的卡片列表 -->
          </div>

          <!-- 档案添加/编辑侧边层/弹窗 -->
          <div id="archive-form-overlay" class="modal-overlay">
            <div class="modal">
              <header class="modal-header">
                <h4 id="form-title">添加新角色</h4>
                <button class="btn-icon" id="btn-close-form">
                  <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
              </header>
              <form id="archive-form" onsubmit="return false;">
                <input type="hidden" id="archive-id">
                <!-- 仅NPC关联选择 -->
                <div class="form-group" id="form-npc-parent-group" style="display: none;">
                  <label>归属（选择关联角色/用户）</label>
                  <select id="archive-parent-id"></select>
                </div>
                <!-- 关系网专用表单项 -->
                <div id="form-relation-fields" style="display: none;">
                  <div class="form-group">
                    <label>源角色/用户/NPC</label>
                    <select id="relation-from"></select>
                  </div>
                  <div class="form-group">
                    <label>目标角色/用户/NPC</label>
                    <select id="relation-to"></select>
                  </div>
                  <div class="form-group">
                    <label>关系描述 (如：挚友, 敌对)</label>
                    <input type="text" id="relation-desc" placeholder="请输入关系名称">
                  </div>
                </div>
                <!-- 常规角色/用户/NPC表单项 -->
                <div id="form-general-fields">
                  <div class="form-group">
                    <label>头像方式</label>
                    <div class="avatar-type-row">
                      <label><input type="radio" name="avatar-type" value="url" checked> URL</label>
                      <label><input type="radio" name="avatar-type" value="local"> 本地文件</label>
                    </div>
                  </div>
                  <div class="form-group" id="avatar-url-group">
                    <label>头像地址 (URL)</label>
                    <input type="text" id="archive-avatar-url" placeholder="https://example.com/avatar.jpg">
                  </div>
                  <div class="form-group" id="avatar-file-group" style="display: none;">
                    <label>选择本地头像</label>
                    <input type="file" id="archive-avatar-file" accept="image/*">
                  </div>
                  <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="archive-name" required placeholder="请输入姓名">
                  </div>
                  <div class="form-group">
                    <label>备注 (仅自己可见，不发给 AI)</label>
                    <input type="text" id="archive-remark" placeholder="备注信息">
                  </div>
                  <div class="form-group">
                    <label>分组</label>
                    <input type="text" id="archive-group" placeholder="例如：主角团、反派、背景人物">
                  </div>
                  <div class="form-group">
                    <label>人设 (System Persona)</label>
                    <textarea id="archive-persona" rows="4" placeholder="详细设定，用于提供给 AI 的人设底料"></textarea>
                  </div>
                </div>
                <div class="form-actions">
                  <button type="button" class="btn btn-outline" id="btn-cancel-form">取消</button>
                  <button type="submit" class="btn btn-primary" id="btn-save-archive">保存</button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <!-- 档案库底部导航 -->
        <footer class="win-footer archive-tabs">
          <button class="tab-item active" data-tab="character">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>角色</span>
          </button>
          <button class="tab-item" data-tab="user">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <span>用户</span>
          </button>
          <button class="tab-item" data-tab="npc">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 11.55C9.64 9.35 6.48 8 3 8v11c3.48 0 6.64 1.35 9 3.55 2.36-2.2 5.52-3.55 9-3.55V8c-3.48 0-6.64 1.35-9 3.55zM12 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
            <span>NPC</span>
          </button>
          <button class="tab-item" data-tab="relation">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span>关系网</span>
          </button>
        </footer>
      </div>
    </div>

    <!-- 底部 Dock 栏 -->
    <footer id="dock">
      <div class="dock-container" id="dock-grid">
        <!-- Dock栏容器：可以拖拽应用到此 -->
      </div>
    </footer>
  </div>

  <!-- 平铺引用的脚本文件 -->
  <script src="db.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="archive.js"></script>
</body>
</html>
