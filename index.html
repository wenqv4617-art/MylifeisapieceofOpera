<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>叙事诗</title>
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
  <style id="customThemeStyle"></style>

  <style>
    :root {
      --phone-w: 100vw;
--phone-h: 100dvh;
--safe-top: 52px;
--dock-height: 78px;

      --ink: #26324a;
      --ink-soft: rgba(38, 50, 74, 0.58);
      --ink-faint: rgba(38, 50, 74, 0.28);

      --rose: #ffd6e8;
      --rose-deep: #ee8fb8;
      --blue: #c9eaff;
      --blue-deep: #72afe4;
      --violet: #e2dcff;

      --shadow-soft: 0 24px 60px rgba(88, 111, 150, 0.18);
      --shadow-tiny: 0 12px 28px rgba(88, 111, 150, 0.13);

      --app-size: 56px;
--app-box-w: 74px;
--app-box-h: 86px;

      --ease-poem: cubic-bezier(.2, .9, .22, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
body {
  width: 100%;
  height: 100%;
  min-height: 100dvh;
  margin: 0;
  overflow: hidden;
  background: #f7f9ff;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
  width: 100vw;
  height: 100dvh;
  display: block;
}

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    input,
    select,
    textarea {
      user-select: text;
    }

    .phone {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  border-radius: 0;
  background:
    radial-gradient(circle at 18% 8%, rgba(255, 214, 232, .92) 0 16%, transparent 40%),
    radial-gradient(circle at 86% 18%, rgba(201, 234, 255, .9) 0 18%, transparent 44%),
    radial-gradient(circle at 48% 88%, rgba(226, 220, 255, .72) 0 28%, transparent 62%),
    linear-gradient(150deg, #fffafd 0%, #f6fbff 48%, #f8f6ff 100%);
  box-shadow: none;
}

    @media (max-width: 430px) {
  .phone {
    width: 100vw;
    height: 100dvh;
    border-radius: 0;
  }
}
    .screen {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background-image:
        linear-gradient(rgba(255,255,255,.32) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.22) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent);
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: -20%;
      pointer-events: none;
      opacity: .22;
      background: radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 2px);
      background-size: 40px 40px;
      animation: starDrift 20s linear infinite;
    }

    @keyframes starDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-40px, 40px, 0); }
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 80;
      width: 100%;
      height: var(--safe-top);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: rgba(38, 50, 74, .58);
      font-size: 12px;
      font-weight: 760;
      pointer-events: none;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .battery-box {
      position: relative;
      width: 24px;
      height: 12px;
      border: 1.6px solid rgba(38,50,74,.5);
      border-radius: 4px;
    }

    .battery-box::after {
      content: "";
      position: absolute;
      top: 3px;
      right: -4px;
      width: 2px;
      height: 5px;
      border-radius: 2px;
      background: rgba(38,50,74,.5);
    }

    .battery-inner {
      display: block;
      width: 72%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--blue-deep), var(--rose-deep));
      opacity: .78;
    }

    .desktop {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow: hidden;
    }

    .desktop-area {
  position: absolute;
  inset: calc(var(--safe-top) + 14px) 0 calc(var(--dock-height) + 28px) 0;
  overflow: hidden;
}
    .edit-hint {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 12px;
      z-index: 12;
      min-height: 38px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border-radius: 999px;
      color: rgba(38,50,74,.5);
      background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(255,255,255,.36));
      border: 1px solid rgba(255,255,255,.82);
      box-shadow: 0 18px 46px rgba(81,109,150,.14), inset 0 1px 0 rgba(255,255,255,.68);
      backdrop-filter: blur(22px);
      font-size: 12px;
      font-weight: 760;
    }

    .editing .edit-hint {
      display: flex;
      animation: panelIn .28s var(--ease-poem);
    }

    @keyframes panelIn {
      from { transform: translateY(8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .app {
      position: absolute;
      z-index: 5;
      width: var(--app-box-w);
      height: var(--app-box-h);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      touch-action: none;
      transform: translate3d(var(--x, 0px), var(--y, 0px), 0) scale(var(--scale, 1));
      transition: transform .24s var(--ease-poem), opacity .2s ease, filter .2s ease;
      will-change: transform;
    }

    .app.dragging {
      --scale: 1.1;
      z-index: 40;
      transition: none;
      filter: drop-shadow(0 20px 26px rgba(88,111,150,.22));
    }

    .editing .app:not(.dragging) {
      animation: appWiggle .42s ease-in-out infinite alternate;
    }

    @keyframes appWiggle {
      from { rotate: -0.35deg; }
      to { rotate: .35deg; }
    }

    .app-icon {
  position: relative;
  width: var(--app-size);
  height: var(--app-size);
  border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(255,255,255,.92), rgba(255,255,255,.46));
      border: 1px solid rgba(255,255,255,.82);
      box-shadow: 0 14px 30px rgba(81,109,150,.13), inset 0 1px 0 rgba(255,255,255,.74);
      backdrop-filter: blur(24px);
      overflow: hidden;
      transition: transform .2s var(--ease-poem);
    }

    .app-icon::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 28% 18%, rgba(255,255,255,.95), transparent 38%),
        radial-gradient(circle at 72% 82%, rgba(214,232,255,.36), transparent 44%),
        linear-gradient(145deg, rgba(255,214,232,.22), rgba(201,234,255,.18));
      pointer-events: none;
    }

    .app:active .app-icon {
      transform: scale(.93);
    }

    .app-icon svg,
    .dock-app svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      color: rgba(38,50,74,.78);
    }

    .app-icon svg {
  position: relative;
  z-index: 2;
  width: 34px;
  height: 34px;
}

.app-name {
  width: 74px;
      text-align: center;
      color: rgba(38,50,74,.58);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-actions {
      position: absolute;
      top: -8px;
      right: 2px;
      z-index: 10;
      display: none;
      gap: 5px;
    }

    .editing .app-actions {
      display: flex;
    }

    .tiny-btn {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(38,50,74,.65);
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.92);
      box-shadow: 0 8px 16px rgba(88,111,150,.14);
      font-size: 15px;
      font-weight: 900;
    }

    .dock {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 16px;
  z-index: 24;
  height: var(--dock-height);
  border-radius: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 10px 14px;
      background: linear-gradient(145deg, rgba(255,255,255,.66), rgba(255,255,255,.32));
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: 0 22px 56px rgba(81,109,150,.16), inset 0 1px 0 rgba(255,255,255,.72);
      backdrop-filter: blur(28px);
    }

    .dock-empty {
      color: rgba(38,50,74,.32);
      font-size: 13px;
      font-weight: 740;
      pointer-events: none;
    }

    .dock-app {
  position: relative;
  width: 54px;
  height: 54px;
  border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(255,255,255,.48));
      border: 1px solid rgba(255,255,255,.86);
      box-shadow: 0 12px 26px rgba(81,109,150,.13), inset 0 1px 0 rgba(255,255,255,.72);
      transition: transform .2s var(--ease-poem);
    }

    .dock-app:active {
      transform: scale(.93);
    }

    .dock-app svg {
  width: 32px;
  height: 32px;
}

    .dock-remove {
      position: absolute;
      top: -9px;
      right: -9px;
      width: 22px;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #ff94b5, #f1779e);
      box-shadow: 0 8px 16px rgba(241,119,158,.25);
      font-size: 15px;
      font-weight: 900;
    }

    .editing .dock-remove {
      display: flex;
    }

    .edit-panel {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: calc(var(--dock-height) + 34px);
      z-index: 35;
      min-height: 58px;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(255,255,255,.36));
      border: 1px solid rgba(255,255,255,.82);
      box-shadow: 0 18px 46px rgba(81,109,150,.14), inset 0 1px 0 rgba(255,255,255,.68);
      backdrop-filter: blur(26px);
    }

    .editing .edit-panel {
      display: flex;
      animation: panelIn .28s var(--ease-poem);
    }

    .panel-text {
      flex: 1;
      padding-left: 8px;
      color: rgba(38,50,74,.5);
      font-size: 12px;
      font-weight: 740;
      line-height: 1.4;
    }

    .panel-btn {
      min-width: 64px;
      padding: 11px 14px;
      border-radius: 18px;
      color: rgba(38,50,74,.68);
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(255,255,255,.88);
      box-shadow: 0 8px 18px rgba(81,109,150,.1);
      font-size: 13px;
      font-weight: 850;
    }

    .panel-btn.primary {
      color: #fff;
      background: linear-gradient(135deg, #92cfff, #ecc5ef);
    }

    .lock-screen {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 128px;
      background:
        radial-gradient(circle at 22% 12%, rgba(255,216,235,.95) 0 20%, transparent 52%),
        radial-gradient(circle at 82% 22%, rgba(215,241,255,.96) 0 22%, transparent 54%),
        radial-gradient(circle at 50% 86%, rgba(230,224,255,.78) 0 32%, transparent 64%),
        linear-gradient(150deg, #fffafd, #f4fbff 48%, #f8f5ff);
      transition: transform .62s var(--ease-poem), opacity .42s ease, filter .42s ease;
    }

    .lock-screen.unlocked {
      transform: translateY(-105%) scale(1.02);
      opacity: 0;
      filter: blur(8px);
      pointer-events: none;
    }

    .lock-date {
      color: rgba(38,50,74,.48);
      font-size: 15px;
      font-weight: 720;
    }

    .lock-time {
      margin-top: 10px;
      color: rgba(38,50,74,.86);
      font-size: 78px;
      font-weight: 780;
      letter-spacing: -5px;
      line-height: 1;
    }

    .lock-title {
      margin-top: 24px;
      color: rgba(38,50,74,.72);
      font-size: 25px;
      font-weight: 850;
      letter-spacing: .24em;
      text-indent: .24em;
    }

    .lock-subtitle {
      margin-top: 10px;
      color: rgba(38,50,74,.42);
      font-size: 13px;
      font-weight: 680;
    }

    .lock-card {
      position: relative;
      width: calc(100% - 52px);
      margin-top: 52px;
      padding: 20px 20px 20px 22px;
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(255,255,255,.38));
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: 0 18px 50px rgba(83,108,146,.14), inset 0 1px 0 rgba(255,255,255,.7);
      backdrop-filter: blur(26px);
      overflow: hidden;
    }

    .lock-card::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 20px;
      bottom: 20px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f19ac0, #90cfff, #d9cdfd);
      opacity: .72;
    }

    .lock-card-title {
      padding-left: 16px;
      color: rgba(38,50,74,.38);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .lock-card-main {
      padding-left: 16px;
      color: rgba(38,50,74,.66);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 730;
    }

    .lock-tip {
      position: absolute;
      bottom: 58px;
      color: rgba(38,50,74,.42);
      font-size: 13px;
      font-weight: 720;
      animation: tipFloat 1.9s ease-in-out infinite;
    }

    @keyframes tipFloat {
      0%, 100% { transform: translateY(0); opacity: .48; }
      50% { transform: translateY(-8px); opacity: .92; }
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 128px;
      z-index: 200;
      max-width: calc(100% - 42px);
      transform: translateX(-50%) translateY(16px);
      padding: 10px 15px;
      border-radius: 999px;
      color: rgba(38,50,74,.66);
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(255,255,255,.88);
      box-shadow: 0 14px 32px rgba(81,109,150,.14), inset 0 1px 0 rgba(255,255,255,.7);
      backdrop-filter: blur(22px);
      font-size: 13px;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      pointer-events: none;
      transition: .24s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .home-indicator {
      position: absolute;
      left: 50%;
      bottom: 7px;
      z-index: 90;
      width: 128px;
      height: 5px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(38,50,74,.15);
      pointer-events: none;
    }

    .settings-layer {
      position: absolute;
      inset: 0;
      z-index: 120;
      display: none;
      background:
        radial-gradient(circle at 18% 10%, rgba(255,214,232,.72), transparent 38%),
        radial-gradient(circle at 86% 22%, rgba(201,234,255,.72), transparent 42%),
        linear-gradient(150deg, rgba(255,250,253,.96), rgba(246,251,255,.96) 52%, rgba(248,246,255,.96));
      backdrop-filter: blur(26px);
    }

    .settings-layer.show {
      display: block;
      animation: settingsIn .28s var(--ease-poem);
    }

    @keyframes settingsIn {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .settings-page {
      position: absolute;
      inset: 0;
      padding: calc(var(--safe-top) + 12px) 18px 20px;
      overflow: hidden;
    }

    .settings-head {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .settings-back,
    .settings-close {
      width: 38px;
      height: 38px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(38,50,74,.66);
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.84);
      box-shadow: 0 10px 24px rgba(81,109,150,.12);
      backdrop-filter: blur(22px);
    }

    .settings-back svg,
    .settings-close svg,
    .settings-row-icon svg,
    .settings-chevron svg,
    .api-float svg {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .settings-back svg,
    .settings-close svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .settings-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .settings-title {
      color: rgba(38,50,74,.82);
      font-size: 22px;
      font-weight: 860;
      letter-spacing: .02em;
    }

    .settings-subtitle {
      margin-top: 2px;
      color: rgba(38,50,74,.38);
      font-size: 12px;
      font-weight: 700;
    }

    .settings-scroll {
      position: absolute;
      left: 18px;
      right: 18px;
      top: calc(var(--safe-top) + 72px);
      bottom: 20px;
      overflow: auto;
      padding-bottom: 20px;
      scrollbar-width: none;
    }

    .settings-scroll::-webkit-scrollbar {
      display: none;
    }

    .settings-section {
      margin-bottom: 16px;
    }

    .settings-section-title {
      margin: 0 4px 8px;
      color: rgba(38,50,74,.42);
      font-size: 12px;
      font-weight: 820;
    }

    .settings-card {
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(255,255,255,.38));
      border: 1px solid rgba(255,255,255,.82);
      box-shadow: 0 18px 46px rgba(81,109,150,.13), inset 0 1px 0 rgba(255,255,255,.68);
      backdrop-filter: blur(26px);
      overflow: hidden;
    }

    .settings-row {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      color: rgba(38,50,74,.72);
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .settings-row + .settings-row {
      border-top: 1px solid rgba(255,255,255,.58);
    }

    .settings-row-icon {
      width: 36px;
      height: 36px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(255,255,255,.9), rgba(255,255,255,.48));
      border: 1px solid rgba(255,255,255,.84);
      color: rgba(38,50,74,.68);
      flex: 0 0 auto;
    }

    .settings-row-icon svg {
      width: 21px;
      height: 21px;
      stroke-width: 1.85;
    }

    .settings-row-main {
      flex: 1;
      min-width: 0;
    }

    .settings-row-name {
      font-size: 15px;
      font-weight: 820;
      color: rgba(38,50,74,.76);
    }

    .settings-row-desc {
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.35;
      color: rgba(38,50,74,.38);
      font-weight: 680;
    }

    .settings-chevron {
      width: 18px;
      height: 18px;
      color: rgba(38,50,74,.32);
      flex: 0 0 auto;
    }

    .settings-chevron svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.1;
    }

    .settings-switch {
      position: relative;
      width: 48px;
      height: 28px;
      border-radius: 999px;
      background: rgba(38,50,74,.14);
      box-shadow: inset 0 1px 3px rgba(38,50,74,.12);
      flex: 0 0 auto;
      transition: .22s ease;
    }

    .settings-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 6px 14px rgba(81,109,150,.18);
      transition: .22s var(--ease-poem);
    }

    .settings-switch.on {
      background: linear-gradient(135deg, #8ccfff, #efbfdc);
    }

    .settings-switch.on::after {
      transform: translateX(20px);
    }

    .settings-form {
      display: grid;
      gap: 12px;
    }

    .settings-field {
      display: grid;
      gap: 7px;
    }

    .settings-label {
      padding-left: 4px;
      color: rgba(38,50,74,.48);
      font-size: 12px;
      font-weight: 800;
    }

    .settings-input,
    .settings-select,
    .settings-textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,.86);
      outline: none;
      color: rgba(38,50,74,.76);
      background: rgba(255,255,255,.58);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 10px 22px rgba(81,109,150,.08);
      font-size: 14px;
      font-weight: 690;
    }

    .settings-input,
    .settings-select {
      min-height: 46px;

    class NarrativeDB {
      constructor() {
        this.db = new Dexie("NarrativePoemPhoneDB");

        this.db.version(1).stores({
          apps: "id, name, order, inDock, dockOrder",
          settings: "key"
        });

        this.db.version(2).stores({
          apps: "id, name, order, inDock, dockOrder",
          settings: "key",
          apiArchives: "++id, name, createdAt, updatedAt",
          apiErrors: "++id, time, source",
          apiUsage: "++id, time, totalTokens"
        });

        this.db.version(3).stores({
          apps: "id, name, order, inDock, dockOrder",
          settings: "key",
          apiArchives: "++id, name, createdAt, updatedAt",
          apiErrors: "++id, time, source",
          apiUsage: "++id, time, totalTokens",
          personas: "++id, type, name, createdAt, updatedAt"
        });
      }

      async init(defaultApps) {
        const oldApps = await this.db.apps.toArray();

        if (oldApps.length === 0) {
          await this.db.apps.bulkPut(defaultApps);
        } else {
          const oldMap = new Map(oldApps.map(app => [app.id, app]));

          const merged = defaultApps.map(defaultApp => {
            const old = oldMap.get(defaultApp.id);
            if (!old) return defaultApp;

            return {
              ...defaultApp,
              x: typeof old.x === "number" ? old.x : defaultApp.x,
              y: typeof old.y === "number" ? old.y : defaultApp.y,
              inDock: typeof old.inDock === "boolean" ? old.inDock : defaultApp.inDock,
              dockOrder: typeof old.dockOrder === "number" ? old.dockOrder : defaultApp.dockOrder
            };
          });

          await this.db.apps.clear();
          await this.db.apps.bulkPut(merged);
        }

        if (typeof await this.getSetting("customCSS") !== "string") {
          await this.setSetting("customCSS", "");
        }
      }

      async getApps() {
        return await this.db.apps.orderBy("order").toArray();
      }

      async saveApps(apps) {
        return await this.db.apps.bulkPut(apps);
      }

      async resetApps(defaultApps) {
        await this.db.apps.clear();
        await this.db.apps.bulkPut(defaultApps);
      }

      async getSetting(key) {
        const row = await this.db.settings.get(key);
        return row ? row.value : null;
      }

      async setSetting(key, value) {
        return await this.db.settings.put({ key, value });
      }
    }

    async function addToDock(appId) {
      const app = apps.find(item => item.id === appId);
      if (!app) return;

      if (app.inDock) {
        showToast("已在 Dock 中");
        return;
      }

      const dockApps = apps.filter(item => item.inDock).sort((a, b) => a.dockOrder - b.dockOrder);

      if (dockApps.length >= 4) {
        showToast("Dock 最多放 4 个应用");
        return;

      app.inDock = true;
      app.dockOrder = dockApps.length + 1;

      await saveApps();
      render();
      showToast(`「${app.name}」已加入 Dock`);
    }

    async function removeFromDock(appId) {
      const app = apps.find(item => item.id === appId);
      if (!app) return;

      app.inDock = false;
      app.dockOrder = 0;

      apps.filter(item => item.inDock)

        .forEach((item, index) => item.dockOrder = index + 1);

      await saveApps();
      render();
      showToast(`「${app.name}」已移出 Dock`);

    function getDesktopBounds() {
      const rect = desktopArea.getBoundingClientRect();

    function createDesktopApp(app) {
      const el = document.createElement("div");
      el.className = "app";
      el.dataset.id = app.id;
      el.style.setProperty("--x", `${app.x || 0}px`);
      el.style.setProperty("--y", `${app.y || 0}px`);

      el.innerHTML = `
        <div class="app-actions">
          <button class="tiny-btn" data-action="dock" title="加入 Dock">+</button>
        </div>
        <div class="app-icon">${svgIcon(app.icon)}</div>
        <div class="app-name">${app.name}</div>
      `;

      const dockBtn = el.querySelector('[data-action="dock"]');

      dockBtn.addEventListener("pointerdown", e => e.stopPropagation());
      dockBtn.addEventListener("click", async e => {
        e.stopPropagation();
        await addToDock(app.id);
      });

      el.addEventListener("click", () => {
        if (dragging) return;
        openApp(app);
      });

      el.addEventListener("pointerdown", e => {
        if (e.button !== undefined && e.button !== 0) return;

        const startX = e.clientX;
        const startY = e.clientY;

        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => setEditing(true), 520);

        if (!editing) return;

        e.preventDefault();

        dragging = {
          app,
          el,
          startX,
          startY,
          baseX: Number(app.x || 0),
          baseY: Number(app.y || 0),
          moved: false
        };

        el.classList.add("dragging");
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
      });

      el.addEventListener("pointermove", e => {
        if (!dragging || dragging.el !== el) return;

        const dx = e.clientX - dragging.startX;
        const dy = e.clientY - dragging.startY;

        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          dragging.moved = true;
          clearTimeout(longPressTimer);
        }

        const bounds = getDesktopBounds();
const appW = el.offsetWidth || 74;
const appH = el.offsetHeight || 86;

app.x = Math.round(clamp(dragging.baseX + dx, 0, bounds.w - appW));
app.y = Math.round(clamp(dragging.baseY + dy, 0, bounds.h - appH));

el.style.setProperty("--x", `${app.x}px`);
el.style.setProperty("--y", `${app.y}px`);
      });

      async function endPointer(e) {
        clearTimeout(longPressTimer);
        if (!dragging || dragging.el !== el) return;

        try { el.releasePointerCapture(e.pointerId); } catch (_) {}

        el.classList.remove("dragging");

        const moved = dragging.moved;
        dragging = null;

        if (moved) {
          suppressClickUntil = Date.now() + 250;
          await saveApps();
        }
      }

      el.addEventListener("pointerup", endPointer);
      el.addEventListener("pointercancel", endPointer);

      return el;
    }

    function nowText() {

      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;

    function maskKey(key) {
      if (!key) return "未填写";
      if (key.length <= 10) return "已填写";
      return `${key.slice(0, 6)}...${key.slice(-4)}`;
    }

    function normalizeModelsURL(raw) {
      let url = String(raw || "").trim();
      if (!url) return "";
      url = url.replace(/\/+$/, "");
      if (url.endsWith("/models")) return url;
      if (url.endsWith("/v1")) return `${url}/models`;
      if (url.includes("/chat/completions")) return url.replace(/\/chat\/completions.*$/, "/models");
      return `${url}/models`;
    }

    async function fetchModelsFromApi(url, apiKey) {
      const endpoint = normalizeModelsURL(url);
      if (!endpoint) throw new Error("请先填写 API URL");

      const headers = {};
      if (apiKey) headers.Authorization = `Bearer ${apiKey}`;

      const res = await fetch(endpoint, { method: "GET", headers });

      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error(`模型拉取失败：${res.status} ${text.slice(0, 120)}`);
      }

      const json = await res.json();
      const models = Array.isArray(json.data)
        ? json.data.map(item => item.id || item.name).filter(Boolean)
        : [];

      if (models.length === 0) throw new Error("没有从接口返回可用模型");
      return models;
    }

    async function logApiError(source, error) {
      const message = error instanceof Error ? error.message : String(error || "未知错误");

      await narrativeDB.db.apiErrors.add({
        time: Date.now(),
        source: source || "unknown",
        message
      });

      const all = await narrativeDB.db.apiErrors.orderBy("time").toArray();
      if (all.length > 30) {
        await narrativeDB.db.apiErrors.bulkDelete(all.slice(0, all.length - 30).map(item => item.id));
      }
    }

    async function reportApiUsage(usage) {
      const totalTokens = Number(usage?.total_tokens) || Number(usage?.totalTokens) || Number(usage?.total) || 0;
      const promptTokens = Number(usage?.prompt_tokens) || Number(usage?.promptTokens) || 0;
      const completionTokens = Number(usage?.completion_tokens) || Number(usage?.completionTokens) || 0;

      await narrativeDB.db.apiUsage.add({
        time: Date.now(),
        totalTokens,
        promptTokens,
        completionTokens
      });

      const all = await narrativeDB.db.apiUsage.orderBy("time").toArray();
      if (all.length > 20) {
        await narrativeDB.db.apiUsage.bulkDelete(all.slice(0, all.length - 20).map(item => item.id));
      }
    }

    async function exportAllData() {
      const tables = {};

      for (const table of narrativeDB.db.tables) {
        tables[table.name] = await table.toArray();
      }

      const data = {
        type: "NarrativePhoneGlobalData",
        version: 1,
        exportedAt: Date.now(),
        tables,
        localStorage: { ...localStorage },
        sessionStorage: { ...sessionStorage }
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      const url = URL.createObjectURL(blob);

      a.href = url;
      a.download = `narrative-phone-data-${Date.now()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("数据已导出");
    }

    async function importAllData(file) {
      try {
        const text = await file.text();
        const data = JSON.parse(text);

        if (data.type !== "NarrativePhoneGlobalData" || !data.tables) {
          throw new Error("文件格式不正确");
        }

        if (!confirm("导入会覆盖当前本地数据，是否继续？")) return;

        for (const table of narrativeDB.db.tables) {
          const rows = data.tables[table.name];
          if (!Array.isArray(rows)) continue;

          await table.clear();
          if (rows.length) await table.bulkPut(rows);
        }

        if (data.localStorage) {
          Object.entries(data.localStorage).forEach(([key, value]) => localStorage.setItem(key, value));
        }

        if (data.sessionStorage) {
          Object.entries(data.sessionStorage).forEach(([key, value]) => sessionStorage.setItem(key, value));
        }

        showToast("数据已导入");
        setTimeout(() => location.reload(), 500);
      } catch (error) {
        await logApiError("importData", error);
        showToast(error.message || "导入失败");
      }
    }

    function setupFloatDrag() {
  let state = null;

  apiFloat.addEventListener("pointerdown", e => {
    if (e.button !== undefined && e.button !== 0) return;

    const rect = apiFloat.getBoundingClientRect();

    state = {
      startX: e.clientX,
      startY: e.clientY,
      baseX: rect.left,
      baseY: rect.top,
      moved: false
    };

    try {
      apiFloat.setPointerCapture(e.pointerId);
    } catch (_) {}
  });

  apiFloat.addEventListener("pointermove", e => {
    if (!state) return;

    const dx = e.clientX - state.startX;
    const dy = e.clientY - state.startY;

    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
      state.moved = true;
    }

    const size = apiFloat.offsetWidth || 42;

    const x = Math.max(8, Math.min(window.innerWidth - size - 8, state.baseX + dx));
    const y = Math.max(56, Math.min(window.innerHeight - size - 16, state.baseY + dy));

    apiFloat.style.left = `${x}px`;
    apiFloat.style.top = `${y}px`;
  });

  async function end(e) {
    if (!state) return;

    try {
      apiFloat.releasePointerCapture(e.pointerId);
    } catch (_) {}

    const size = apiFloat.offsetWidth || 42;
    const rect = apiFloat.getBoundingClientRect();

    const currentX = rect.left;
    const currentY = rect.top;

    const snapX = currentX + size / 2 > window.innerWidth / 2
      ? window.innerWidth - size - 10
      : 10;

    const finalY = Math.max(56, Math.min(window.innerHeight - size - 16, currentY));

    apiFloat.style.left = `${snapX}px`;
    apiFloat.style.top = `${finalY}px`;

    await setUISettings({
      apiFloatX: snapX,
      apiFloatY: finalY
    });

    apiFloat.dataset.dragged = state.moved ? "1" : "0";
    state = null;
  }

  apiFloat.addEventListener("pointerup", end);
  apiFloat.addEventListener("pointercancel", end);

  window.addEventListener("resize", async () => {
    const ui = await getUISettings();
    const size = apiFloat.offsetWidth || 42;

    const x = Number(ui.apiFloatX || 10);
    const y = Number(ui.apiFloatY || 160);

    const fixedX = x + size / 2 > window.innerWidth / 2
      ? window.innerWidth - size - 10
      : 10;

    const fixedY = Math.max(56, Math.min(window.innerHeight - size - 16, y));

    apiFloat.style.left = `${fixedX}px`;
    apiFloat.style.top = `${fixedY}px`;

    await setUISettings({
      apiFloatX: fixedX,
      apiFloatY: fixedY
    });
  });
}

    async function applyFloatVisibility() {
  ensureSettingsShell();

  const ui = await getUISettings();

  const x = Math.max(8, Math.min(window.innerWidth - size - 8, Number(ui.apiFloatX || 10)));

  apiFloat.style.left = `${x}px`;

  apiFloat.classList.toggle("show", !!ui.apiFloatEnabled);

}

      fab.title = "新建档案";
      fab.innerHTML = iconPlus();
      fab.addEventListener("click", () => renderPersonaEditor(null, archiveTab));
      archiveLayer.querySelector(".settings-page").appendChild(fab);

      archiveLayer.querySelectorAll("[data-tab]").forEach(btn => {
        btn.addEventListener("click", () => {
          archiveTab = btn.dataset.tab;
          renderArchiveHome();
        });
      });

      archiveLayer.querySelectorAll("[data-edit-persona]").forEach(btn => {
        btn.addEventListener("click", () => {
          renderPersonaEditor(Number(btn.dataset.editPersona), archiveTab);
        });
      });
    }

    async function renderPersonaEditor(id, type) {
      const isNew = !id;
      const persona = isNew
        ? { type, name: "", gender: "", avatar: "", details: "" }
        : await getPersona(id);

      if (!persona) {
        showToast("档案不存在");
        renderArchiveHome();
        return;
      }

      const personaType = persona.type || type;
      const title = isNew
        ? (personaType === "user" ? "新建用户档案" : "新建角色档案")
        : (personaType === "user" ? "编辑用户档案" : "编辑角色档案");

      const subtitle = personaType === "user" ? "我方人设" : "角色人设";

      const draft = {
        name: persona.name || "",
        gender: persona.gender || "",
        avatar: persona.avatar || "",
        details: persona.details || ""
      };

      const renderEditor = () => {
        archiveFrame(title, subtitle, `
          <div class="settings-section">
            <div class="settings-card" style="padding:18px 14px;">
              <div class="avatar-editor">
                <div class="avatar-large" id="avatarPreview">${renderAvatarThumb(draft.avatar)}</div>
                <div class="avatar-actions">
                  <button class="settings-btn" id="avatarUploadBtn">上传图片</button>
                  <button class="settings-btn" id="avatarUrlBtn">URL 导入</button>
                  ${draft.avatar ? `<button class="settings-btn danger" id="avatarClearBtn">清除</button>` : ""}
                </div>
                <input type="file" id="avatarFileInput" accept="image/*" style="display:none">
              </div>
            </div>
          </div>

          <div class="settings-section">
            <div class="settings-card" style="padding:14px;">
              <div class="settings-form">
                <div class="settings-field">
                  <div class="field-row-head">
                    <label class="settings-label">姓名</label>
                    <span class="name-counter" id="nameCounter">${draft.name.length}/15</span>
                  </div>
                  <input class="settings-input" id="personaName" maxlength="15" placeholder="请输入姓名（15 字以内）" value="${escapeHTML(draft.name)}">
                </div>

                <div class="settings-field">
                  <label class="settings-label">性别</label>
                  <div class="gender-options">
                    <button class="gender-option ${draft.gender === "男" ? "active" : ""}" data-gender="男">男</button>
                    <button class="gender-option ${draft.gender === "女" ? "active" : ""}" data-gender="女">女</button>
                  </div>
                </div>

                <div class="settings-field">
                  <label class="settings-label">人设详情</label>
                  <textarea class="settings-textarea" id="personaDetails" placeholder="自由书写人设、性格、背景等内容" rows="6">${escapeHTML(draft.details)}</textarea>
                </div>
              </div>
            </div>
          </div>

          <div class="settings-section">
            <div class="settings-actions">
              <button class="settings-btn primary" id="savePersonaBtn" style="flex:1;">${isNew ? "创建档案" : "保存修改"}</button>
              ${isNew ? "" : `<button class="settings-btn danger" id="deletePersonaBtn">删除</button>`}
            </div>
          </div>
        `, renderArchiveHome);

        const nameInput = archiveLayer.querySelector("#personaName");
        const nameCounter = archiveLayer.querySelector("#nameCounter");
        const detailsInput = archiveLayer.querySelector("#personaDetails");
        const fileInput = archiveLayer.querySelector("#avatarFileInput");
        const preview = archiveLayer.querySelector("#avatarPreview");

        nameInput.addEventListener("input", () => {
          if (nameInput.value.length > 15) {
            nameInput.value = nameInput.value.slice(0, 15);
          }
          draft.name = nameInput.value;
          nameCounter.textContent = `${draft.name.length}/15`;
        });

        detailsInput.addEventListener("input", () => {
          draft.details = detailsInput.value;
        });

        archiveLayer.querySelectorAll("[data-gender]").forEach(btn => {
          btn.addEventListener("click", () => {
            draft.gender = btn.dataset.gender;
            archiveLayer.querySelectorAll("[data-gender]").forEach(b => b.classList.toggle("active", b === btn));
          });
        });

        archiveLayer.querySelector("#avatarUploadBtn").addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", async e => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;

          if (!file.type.startsWith("image/")) {
            showToast("请选择图片文件");
            return;
          }

          if (file.size > 2 * 1024 * 1024) {
            showToast("图片需小于 2MB");
            return;
          }

          try {
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(reader.error);
              reader.readAsDataURL(file);
            });

            draft.avatar = String(dataUrl || "");
            preview.innerHTML = renderAvatarThumb(draft.avatar);
            renderEditor();
          } catch (error) {
            showToast("图片读取失败");
          }
        });

        archiveLayer.querySelector("#avatarUrlBtn").addEventListener("click", () => {
          const url = prompt("请输入图片 URL", draft.avatar.startsWith("data:") ? "" : draft.avatar);
          if (url === null) return;

          const trimmed = String(url).trim();
          if (!trimmed) {
            showToast("URL 不能为空");
            return;
          }

          draft.avatar = trimmed;
          renderEditor();
        });

        const clearBtn = archiveLayer.querySelector("#avatarClearBtn");
        if (clearBtn) {
          clearBtn.addEventListener("click", () => {
            draft.avatar = "";
            renderEditor();
          });
        }

        archiveLayer.querySelector("#savePersonaBtn").addEventListener("click", async () => {
          const name = (draft.name || "").trim();
          if (!name) {
            showToast("请填写姓名");
            return;
          }
          if (name.length > 15) {
            showToast("姓名需在 15 字以内");
            return;
          }

          if (isNew) {
            await createPersona({
              type: personaType,
              name,
              gender: draft.gender,
              avatar: draft.avatar,
              details: draft.details
            });
            showToast("档案已创建");
          } else {
            await updatePersona(id, {
              name,
              gender: draft.gender,
              avatar: draft.avatar,
              details: draft.details
            });
            showToast("档案已保存");
          }

          archiveTab = personaType;
          renderArchiveHome();
        });

        const delBtn = archiveLayer.querySelector("#deletePersonaBtn");
        if (delBtn) {
          delBtn.addEventListener("click", async () => {
            if (!confirm("确定删除这条档案吗？此操作不可撤销。")) return;
            await deletePersona(id);
            showToast("档案已删除");
            archiveTab = personaType;
            renderArchiveHome();
          });
        }
      };

      renderEditor();
    }

    window.NarrativePhone.openArchive = openArchive;

    async function initSettingsApp() {
      ensureSettingsShell();

      const ui = await getUISettings();
      await setUISettings({ ...DEFAULT_UI_SETTINGS, ...ui });

      const api = await getApiConfig();
      await setApiConfig({ ...DEFAULT_API_CONFIG, ...api });

      await applyFloatVisibility();
      applyLockEnabled((await getUISettings()).lockEnabled);
    }

    async function boot() {
      await narrativeDB.init(defaultApps);

      apps = await narrativeDB.getApps();

      updateTime();
      setInterval(updateTime, 1000 * 10);

      await loadCustomCSS();

      render();

      await initSettingsApp();
    }

    boot();
  </script>
</body>
</html>
